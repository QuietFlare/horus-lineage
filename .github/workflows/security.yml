# Security scanning, from the shared workflows in QuietFlare/ci-workflows.
#
#   gitleaks    full git history, every run. A secret that was committed
#               and later removed is still in every clone.
#   pip-audit   the 48 packages uv.lock pins, exported and checked against
#               the PyPI advisory database.
#
# The weekly schedule matters most for the audit: a dependency set that
# was clean on Monday is not necessarily clean on Friday, and nothing
# about this repo has to change for that to happen.
#
# GitHub dependency review is deliberately off. It reads the dependency
# graph, which does not parse uv.lock yet, so it would inspect nothing
# here and pass. Turn it back on when uv.lock is supported:
#   https://github.com/orgs/community/discussions/163831
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: QuietFlare/ci-workflows/.github/workflows/security-scan.yml@v1
    with:
      secret-scan: true
      dependency-review: false

  audit:
    uses: QuietFlare/ci-workflows/.github/workflows/python-audit.yml@v1
    with:
      # Must be at least this project's requires-python, or pip-audit's
      # resolver cannot install horus-runtime and reports it as missing
      # rather than as a version mismatch.
      python-version: '3.13'
