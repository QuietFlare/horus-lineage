[project]
name = "horus-lineage"
description = "Records what a Horus run did: one JSON record per task, one per run, joined by content digests."
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
classifiers = [
  "Programming Language :: Python :: 3",
]
# 0.5.0 is the first release with BaseArtifact.labels and with local
# file digests in the task fingerprint. Both are load-bearing here.
dependencies = ["horus-runtime>=0.5.0"]
dynamic = ["version"]

[project.scripts]
horus-lineage = "horus_lineage.cli:main"

# ================
# Plugin entry-points
# ================
[project.entry-points."horus.middleware.workflow"]
lineage_workflow = "horus_lineage.middleware.workflow"

[project.entry-points."horus.middleware.target"]
lineage_target = "horus_lineage.middleware.target"

[project.entry-points."horus.middleware.task"]
lineage_task = "horus_lineage.middleware.task"

[project.entry-points."horus.middleware.runtime"]
lineage_runtime = "horus_lineage.middleware.runtime"

# ================

[dependency-groups]
dev = [
  "babel~=2.0",
  "mypy~=1.19",
  "pre_commit~=4.0",
  "pytest~=9.0",
  "pytest-asyncio~=1.3.0",
  "pytest-cov~=7.0",
  "ruff~=0.15",
  "types-PyYAML~=6.0",
  "uv-dynamic-versioning>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.29,<2.0", "uv-dynamic-versioning>=0.14.0,<1.0"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["horus_lineage"]

[tool.coverage.report]
omit = ["tests/*"]

# Other tool configurations
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/horus_lineage"]
# py.typed ships the type marker; compiled translations are git-ignored (*.mo)
# but must ship in the wheel.
artifacts = ["src/horus_lineage/py.typed", "src/horus_lineage/locale/**/*.mo"]

[tool.hatch.build.targets.sdist]
include = ["src/horus_lineage", "tests"]
artifacts = ["src/horus_lineage/py.typed", "src/horus_lineage/locale/**/*.mo"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["build", "dist"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = """
    --verbose
    --cov=src/horus_lineage
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
"""
minversion = "7.0"
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "PL",  # pylint
  "RUF",  # ruff-specific
  "ARG",  # ruff-arglint
  "SLF",  # ruff-slf
]
extend-select = ["T201"]  # Prevent use of print()

# U+2212 is the real minus, paired with the "+" on the same fold marker.
# It is written literally because the CSS escape "\2212" would be read as
# an octal escape by Python before CSS ever sees it.
allowed-confusables = ["−"]

ignore = [
  "E203",  # Whitespace before ':', conflicts with formatter
  "D104",  # Missing docstring in __init__ (often redundant)
  "D205",  # 1 blank line required between summary line and description
  "D212",  # Multi-line docstring summary should start at the first line
  "D200",  # One-line docstring should fit on one line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001"]
# Base64 font faces are one very long line each, by construction.
"src/horus_lineage/fonts.py" = ["E501"]
# A command prints; and it imports its subcommand only once chosen,
# so `horus-lineage --help` does not pay for every report.
"src/horus_lineage/cli.py" = ["T201", "PLC0415"]
"src/horus_lineage/report.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.1"
